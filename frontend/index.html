<!DOCTYPE html>
<html>
<head>
  <title>DICOM Viewer</title>

  <script src="https://unpkg.com/cornerstone-core/dist/cornerstone.js"></script>
  <script src="https://unpkg.com/dicom-parser/dist/dicomParser.js"></script>
  <script src="https://unpkg.com/cornerstone-wado-image-loader/dist/cornerstoneWADOImageLoader.bundle.min.js"></script>
  <script src="https://unpkg.com/hammerjs/hammer.min.js"></script>
  <script src="https://unpkg.com/cornerstone-math/dist/cornerstoneMath.js"></script>
  <script src="https://unpkg.com/cornerstone-tools/dist/cornerstoneTools.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 16px; }
    h2 { margin-bottom: 12px; }

    /* ── Series buttons ── */
    #seriesList { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    #seriesList button {
      background: #2a2a2a; color: #ccc; border: 1px solid #444;
      padding: 5px 10px; cursor: pointer; border-radius: 4px; font-size: 13px;
    }
    #seriesList button:hover  { background: #3a3a3a; color: #fff; }
    #seriesList button.active { background: #005a9e; color: #fff; border-color: #0078d4; }

    hr { border-color: #333; margin: 12px 0; }

    /* ── 2D viewer ── */
    #viewerRow  { display: flex; gap: 16px; align-items: flex-start; }
    #viewerCol  { display: flex; flex-direction: column; gap: 6px; }
    #dicomImage { width: 512px; height: 512px; border: 1px solid #444; background: #000; }
    #sliceSlider { width: 512px; }
    #sliceLabel  { font-size: 13px; color: #aaa; text-align: center; width: 512px; }

    #presets { display: flex; gap: 6px; width: 512px; }
    #presets button {
      flex: 1; background: #2a2a2a; color: #ccc; border: 1px solid #444;
      padding: 5px 0; cursor: pointer; border-radius: 4px; font-size: 12px;
    }
    #presets button:hover { background: #3a3a3a; color: #fff; }

    /* ── Structures panel ── */
    #structBtn {
      display: none; width: 512px; padding: 6px 0; border-radius: 4px;
      cursor: pointer; font-size: 13px; font-weight: 600;
      background: #2a2a2a; color: #ccc; border: 1px solid #444;
    }
    #structBtn:hover { background: #3a3a3a; color: #fff; }

    #structPanel {
      display: none; flex-direction: column; gap: 14px;
      background: #222; border: 1px solid #444; border-radius: 6px;
      padding: 14px; width: 230px; font-size: 13px; align-self: flex-start;
    }
    #structPanel h4 {
      font-size: 14px; color: #aaa; margin: 0;
      border-bottom: 1px solid #444; padding-bottom: 6px;
    }
    .sp-section { display: flex; flex-direction: column; gap: 6px; }
    .sp-hdr {
      font-size: 10px; font-weight: 700; color: #666;
      letter-spacing: 0.8px; text-transform: uppercase;
    }
    .sp-empty { color: #555; font-size: 12px; }
    .sp-row {
      display: flex; align-items: center; gap: 5px;
      padding: 2px 0; user-select: none;
    }
    .sp-row input[type=checkbox] { cursor: pointer; flex-shrink: 0; }
    .sp-row input[type=color] {
      width: 20px; height: 15px; padding: 1px; border: 1px solid #555;
      border-radius: 2px; cursor: pointer; background: none; flex-shrink: 0;
    }
    .sp-name { font-size: 12px; color: #ccc; flex: 1; }
    .sp-name-input {
      flex: 1; background: #1a1a1a; border: 1px solid #444; border-radius: 3px;
      color: #ccc; font-size: 12px; padding: 2px 5px; min-width: 0;
    }
    .sp-name-input:focus { outline: none; border-color: #0078d4; }

    #roiDrawBtn {
      padding: 5px 0; border-radius: 4px; cursor: pointer;
      font-size: 12px; font-weight: 600; background: #2a2a2a;
      color: #ccc; border: 1px solid #444; width: 100%;
    }
    #roiDrawBtn:hover { background: #3a3a3a; color: #fff; }

    #mprBtnGroup {
      display: none; width: 512px; gap: 6px;
    }
    #mprBtnGroup button {
      flex: 1; padding: 7px 0; border-radius: 4px; cursor: pointer;
      font-size: 13px; font-weight: 600; border: 1px solid #0078d4;
    }
    #mprCpuBtn { background: #1a3a5a; color: #4fc3f7; }
    #mprCpuBtn:hover { background: #1e4a72; }
    #mprGpuBtn { background: #1a4a2a; color: #81c784; }
    #mprGpuBtn:hover { background: #225533; }
    #volBtn { background: #3a1a4a; color: #ce93d8; }
    #volBtn:hover { background: #4a2260; }
    #drrBtn { background: #3a2a10; color: #ffcc80; }
    #drrBtn:hover { background: #4a3818; }

    /* ── Metadata panel ── */
    #metaPanel {
      background: #222; border: 1px solid #444; border-radius: 6px;
      padding: 14px; min-width: 220px; font-size: 13px; line-height: 1.8;
    }
    #metaPanel h4 { font-size: 14px; color: #aaa; margin-bottom: 8px;
                    border-bottom: 1px solid #444; padding-bottom: 6px; }
    #metaPanel .row { display: flex; justify-content: space-between; gap: 12px; }
    #metaPanel .label { color: #888; }
    #metaPanel .value { color: #fff; font-weight: 500; }
    #metaPanel .wl-display {
      margin-top: 10px; padding: 8px 10px; background: #111;
      border-radius: 4px; border: 1px solid #333; font-size: 14px;
    }
    #metaPanel .wl-display span { color: #4fc3f7; font-weight: 700; }

    /* ── Info panel (RTPLAN, RTSTRUCT etc.) ── */
    #infoPanel { font-family: sans-serif; max-width: 700px; margin-top: 12px; }
    #infoPanel table { border-collapse: collapse; width: 100%; }
    #infoPanel th, #infoPanel td { border: 1px solid #444; padding: 6px 10px; }
    #infoPanel th { background: #2a2a2a; }

    /* ── MPR section ── */
    #mprSection { display: none; }

    #mprTopBar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
    }
    #mprTopBar button {
      background: #2a2a2a; color: #ccc; border: 1px solid #444;
      padding: 5px 12px; cursor: pointer; border-radius: 4px; font-size: 13px;
    }
    #mprTopBar button:hover { background: #3a3a3a; color: #fff; }
    #mprTopBar .back { color: #4fc3f7; border-color: #0078d4; }

    #mprProgressWrap {
      background: #333; border-radius: 4px; height: 4px; margin-bottom: 12px;
    }
    #mprProgressBar {
      height: 100%; width: 0%; background: #4fc3f7;
      border-radius: 4px; transition: width 0.15s;
    }

    #mprGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .mprPane {
      background: #111; border: 1px solid #444;
      border-radius: 6px; padding: 8px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .mprPane .mprLabel {
      font-size: 11px; font-weight: 700; color: #4fc3f7;
      letter-spacing: 1px;
    }
    .mprPane canvas {
      width: 100%; aspect-ratio: 1 / 1;
      background: #000; display: block; cursor: crosshair;
    }
    .mprPane input[type=range] { width: 100%; }
  </style>
</head>

<body>

  <h2>DICOM Viewer</h2>
  <input type="file" id="fileInput" webkitdirectory multiple />
  <hr>
  <div id="seriesList"></div>
  <hr>

  <!-- ── 2D viewer ──────────────────────────────────────────────── -->
  <div id="viewerRow">
    <div id="viewerCol">
      <div id="dicomImage"></div>
      <input type="range" id="sliceSlider" min="0" max="0" value="0">
      <div id="sliceLabel">—</div>
      <div id="presets" style="display:none;">
        <button onclick="applyPreset(-600,1600)">Lung</button>
        <button onclick="applyPreset(400,1800)">Bone</button>
        <button onclick="applyPreset(40,400)">Soft Tissue</button>
        <button onclick="applyPreset(600,2800)">Brain</button>
      </div>
      <div id="modeIndicator" style="font-size:12px;color:#aaa;margin-top:2px;">
        ↕ Scroll mode &nbsp;(middle-click to switch)
      </div>
      <button id="structBtn" onclick="toggleStructPanel()">⊟ Structures</button>
      <div id="mprBtnGroup">
        <button id="mprCpuBtn" onclick="openMPRTab('cpu')">⊞ MPR — CPU</button>
        <button id="mprGpuBtn" onclick="openMPRTab('gpu')">⊞ MPR — GPU</button>
        <button id="volBtn"    onclick="openVolTab()">⬡ 3D View</button>
        <button id="drrBtn"    onclick="openDRRTab()">☀ DRR</button>
      </div>
    </div>

    <div id="metaPanel" style="display:none;">
      <h4>Series Info</h4>
      <div id="metaContent"></div>
      <div class="wl-display">
        WL: <span id="meta-wc">—</span> &nbsp;|&nbsp; WW: <span id="meta-ww">—</span>
      </div>
    </div>

    <!-- ── Structures panel ────────────────────────────────────── -->
    <div id="structPanel">
      <h4>Structures</h4>

      <div class="sp-section">
        <div class="sp-hdr">From File (RTSTRUCT)</div>
        <div id="rtStructList">
          <div class="sp-empty">No RTSTRUCT loaded</div>
        </div>
      </div>

      <div class="sp-section">
        <div class="sp-hdr">Drawn ROIs</div>
        <button id="roiDrawBtn" onclick="toggleRoiDraw()">✏ Draw ROI</button>
        <button id="roiEditBtn" onclick="toggleRoiEdit()"
                style="padding:5px 0;border-radius:4px;cursor:pointer;font-size:12px;
                       font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;width:100%;"
                title="Select ROI to move vertices or delete">
          ✎ Edit ROI
        </button>
        <button id="roiSaveBtn" onclick="roiSave.save()"
                style="padding:5px 0;border-radius:4px;cursor:pointer;font-size:12px;
                       font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;width:100%;"
                title="Save all drawn ROIs to backend (JSON)">
          ↑ Save ROIs
        </button>
        <button id="roiLoadBtn" onclick="showRoiLoadPicker()"
                style="padding:5px 0;border-radius:4px;cursor:pointer;font-size:12px;
                       font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;width:100%;"
                title="Load previously saved ROIs from backend">
          ↓ Load ROIs
        </button>
        <select id="roiFileSelect" onchange="loadSelectedRoi()"
                style="display:none;width:100%;background:#1a1a1a;color:#ccc;
                       border:1px solid #444;border-radius:3px;padding:3px;font-size:11px;">
          <option value="">— select file —</option>
        </select>
        <button id="roiExportBtn" onclick="showRoiExportPicker()"
                style="padding:5px 0;border-radius:4px;cursor:pointer;font-size:12px;
                       font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;width:100%;"
                title="Export drawn ROIs as RTSTRUCT DICOM (.dcm)">
          ⬇ Export RTSTRUCT
        </button>
        <select id="roiExportSelect" onchange="exportSelectedRoi()"
                style="display:none;width:100%;background:#1a1a1a;color:#ccc;
                       border:1px solid #444;border-radius:3px;padding:3px;font-size:11px;">
          <option value="">— select file to export —</option>
        </select>
        <div id="drawnRoiList">
          <div class="sp-empty">No ROIs drawn</div>
        </div>
      </div>
    </div>
  </div>

  <div id="infoPanel" style="display:none;"></div>

  <!-- ── MPR section ───────────────────────────────────────────── -->
  <div id="mprSection">
    <div id="mprTopBar">
      <button class="back" onclick="exitMPR()">← Back to 2D</button>
      <div style="display:flex;gap:6px;">
        <button onclick="applyMPRPreset(-600,1600)">Lung</button>
        <button onclick="applyMPRPreset(400,1800)">Bone</button>
        <button onclick="applyMPRPreset(40,400)">Soft Tissue</button>
        <button onclick="applyMPRPreset(600,2800)">Brain</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="mprModeIndicator" style="font-size:12px;color:#aaa;">↕ Scroll mode &nbsp;(middle-click to switch)</span>
        <button onclick="resetMPRZoom()" title="Reset zoom on all views">⊠ Reset Zoom</button>
        <button id="mprRoiDrawBtn"
          onclick="mprRoi.toggleDrawMode()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;">
          ✏ Draw ROI
        </button>
      </div>
    </div>

    <div id="mprProgressWrap">
      <div id="mprProgressBar"></div>
    </div>

    <div id="mprGrid">
      <div class="mprPane">
        <div class="mprLabel" id="axialLabel">AXIAL</div>
        <canvas id="axialCanvas"></canvas>
        <input type="range" id="axialSlider" min="0" max="0" value="0">
      </div>
      <div class="mprPane">
        <div class="mprLabel" id="coronalLabel">CORONAL</div>
        <canvas id="coronalCanvas"></canvas>
        <input type="range" id="coronalSlider" min="0" max="0" value="0">
      </div>
      <div class="mprPane">
        <div class="mprLabel" id="sagittalLabel">SAGITTAL</div>
        <canvas id="sagittalCanvas"></canvas>
        <input type="range" id="sagittalSlider" min="0" max="0" value="0">
      </div>
    </div>

    <div id="mprRoiPanel" style="margin-top:12px;display:none;">
      <div style="font-size:10px;font-weight:700;color:#666;letter-spacing:0.8px;
                  text-transform:uppercase;margin-bottom:6px;">Drawn ROIs</div>
      <div id="mprRoiList">
        <div style="color:#555;font-size:12px;">No ROIs drawn</div>
      </div>
    </div>

  </div>

  <script src="gpu-volume.js"></script>
  <script src="gpu-slice.js"></script>
  <script src="mpr.js"></script>
  <script src="rtstruct-overlay.js"></script>
  <script src="roi-store.js"></script>
  <script src="roi-draw.js"></script>
  <script src="mpr-roi.js"></script>
  <script src="roi-save.js"></script>
  <script src="app.js"></script>
</body>
</html>
