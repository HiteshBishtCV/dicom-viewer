<!DOCTYPE html>
<html>
<head>
  <title>MPR View — DICOM</title>

  <!-- Cornerstone (required by mpr.js / buildVolume) -->
  <script src="https://unpkg.com/cornerstone-core/dist/cornerstone.js"></script>
  <script src="https://unpkg.com/dicom-parser/dist/dicomParser.js"></script>
  <script src="https://unpkg.com/cornerstone-wado-image-loader/dist/cornerstoneWADOImageLoader.bundle.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 16px; }

    /* ── Waiting overlay ── */
    #mprTabWaiting {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 80vh; gap: 16px;
    }
    #mprTabWaiting p { color: #aaa; font-size: 15px; }

    /* ── MPR section ── */
    #mprSection { display: none; }

    #mprTopBar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
    }
    #mprTopBar button {
      background: #2a2a2a; color: #ccc; border: 1px solid #444;
      padding: 5px 12px; cursor: pointer; border-radius: 4px; font-size: 13px;
    }
    #mprTopBar button:hover { background: #3a3a3a; color: #fff; }

    #mprProgressWrap {
      background: #333; border-radius: 4px; height: 4px; margin-bottom: 12px;
    }
    #mprProgressBar {
      height: 100%; width: 0%; background: #4fc3f7;
      border-radius: 4px; transition: width 0.15s;
    }

    #mprGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .mprPane {
      background: #111; border: 1px solid #444;
      border-radius: 6px; padding: 8px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .mprPane .mprLabel {
      font-size: 11px; font-weight: 700; color: #4fc3f7;
      letter-spacing: 1px;
    }
    .mprPane canvas {
      width: 100%; aspect-ratio: 1 / 1;
      background: #000; display: block; cursor: crosshair;
    }
    .mprPane input[type=range] { width: 100%; }

    /* Mode badge top-right */
    #mprModeBadge {
      font-size: 12px; font-weight: 700; padding: 3px 10px;
      border-radius: 4px; letter-spacing: 1px;
    }
    #mprModeBadge.cpu { background: #1a3a5a; color: #4fc3f7; border: 1px solid #0078d4; }
    #mprModeBadge.gpu { background: #1a4a2a; color: #81c784; border: 1px solid #4caf50; }
  </style>
</head>

<body>

  <!-- Shown while waiting for volume data from the opener tab -->
  <div id="mprTabWaiting">
    <p id="mprTabWaitMsg">Connecting to DICOM viewer…</p>
    <div id="mprProgressWrapWait" style="width:300px;background:#333;border-radius:4px;height:4px;">
      <div id="mprProgressBarWait" style="height:100%;width:0%;background:#4fc3f7;border-radius:4px;transition:width 0.15s;"></div>
    </div>
  </div>

  <!-- MPR section (made visible by showMPRView) -->
  <div id="mprSection">

    <div id="mprTopBar">
      <span id="mprModeBadge">MPR</span>
      <div style="display:flex;gap:6px;">
        <button onclick="applyMPRPreset(-600,1600)">Lung</button>
        <button onclick="applyMPRPreset(400,1800)">Bone</button>
        <button onclick="applyMPRPreset(40,400)">Soft Tissue</button>
        <button onclick="applyMPRPreset(600,2800)">Brain</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span id="mprModeIndicator" style="font-size:12px;color:#aaa;">↕ Scroll mode &nbsp;(middle-click to switch)</span>
        <button onclick="resetMPRZoom()">⊠ Reset Zoom</button>
        <button id="mprRoiDrawBtn" onclick="mprRoi.toggleDrawMode()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;">
          ✏ Draw ROI
        </button>
        <button id="mprRoiFreehandBtn" onclick="mprRoi.toggleFreehandMode()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;"
          title="Freehand brush: hold and drag to draw contour; scroll to adjust vertex spacing">
          ✏ Brush
        </button>
        <button id="mprRoiEditBtn" onclick="toggleMprEdit()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;">
          ✎ Edit ROI
        </button>
        <button onclick="roiSave.save()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;"
          title="Save all ROIs to backend (JSON)">
          ↑ Save ROIs
        </button>
        <button onclick="showMprLoadPicker()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;"
          title="Load previously saved ROIs from backend">
          ↓ Load ROIs
        </button>
        <button onclick="showMprExportPicker()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;"
          title="Export ROIs as RTSTRUCT DICOM (.dcm)">
          ⬇ RTSTRUCT
        </button>
        <button id="mprInterpolateBtn" onclick="runMprInterpolate()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;"
          title="Interpolate between axial key-frame ROIs of the same name">
          ⟷ Interpolate
        </button>
        <button onclick="runMprClearInterpolated()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#555;border:1px solid #333;"
          title="Remove all interpolated contours for a structure">
          ✕ Clear Interp
        </button>
        <button onclick="openMlSegTab()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#1a2a3a;color:#4fc3f7;border:1px solid #0078d4;"
          title="Open AI segmentation window (TotalSegmentator — heart + lungs)">
          🤖 AI Segment
        </button>
        <button onclick="openFieldStatsTab()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#1a3a1a;color:#81c784;border:1px solid #2e7d32;"
          title="Compute lung/heart volume overlap with the drawn treatment field ROI">
          📊 Field Stats
        </button>
      </div>
    </div>

    <div id="mprProgressWrap">
      <div id="mprProgressBar"></div>
    </div>

    <div id="mprGrid">
      <div class="mprPane">
        <div class="mprLabel" id="axialLabel">AXIAL</div>
        <canvas id="axialCanvas"></canvas>
        <input type="range" id="axialSlider" min="0" max="0" value="0">
      </div>
      <div class="mprPane">
        <div class="mprLabel" id="coronalLabel">CORONAL</div>
        <canvas id="coronalCanvas"></canvas>
        <input type="range" id="coronalSlider" min="0" max="0" value="0">
      </div>
      <div class="mprPane">
        <div class="mprLabel" id="sagittalLabel">SAGITTAL</div>
        <canvas id="sagittalCanvas"></canvas>
        <input type="range" id="sagittalSlider" min="0" max="0" value="0">
      </div>
    </div>

    <!-- Auto-Segment panel -->
    <div id="mprAutoSegPanel" style="margin-top:12px;border-top:1px solid #2a2a2a;padding-top:10px;">
      <div style="font-size:10px;font-weight:700;color:#555;letter-spacing:0.8px;
                  text-transform:uppercase;margin-bottom:6px;">Auto-Segment</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
        <button id="mprSegLungBtn" onclick="startLungSeedPicker()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;"
          title="Click two seed points (left lung, right lung) to auto-segment both lungs">
          🫁 Segment Lungs
        </button>
        <button id="mprSegHeartBtn" onclick="startHeartSeedPicker()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;"
          title="Click inside the heart on the axial view to segment it">
          ❤ Segment Heart
        </button>
        <button id="mprSegBoxBtn" onclick="mprRoi.toggleBoxMode()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#ccc;border:1px solid #444;"
          title="Draw a bounding box on any view to constrain heart segmentation (draw on axial + coronal or sagittal)">
          🔲 Seg Box
        </button>
        <button onclick="mprRoi.clearSegBoxes()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#555;border:1px solid #333;"
          title="Clear all segmentation bounding boxes">
          ✕ Clear Box
        </button>
        <button onclick="cancelSegPicker()"
          style="padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;
                 font-weight:600;background:#2a2a2a;color:#555;border:1px solid #333;"
          title="Cancel current seed-picking operation">
          ✕ Cancel
        </button>
      </div>
      <div id="mprSegStatus"
           style="display:none;color:#aaa;font-size:12px;margin-top:6px;
                  padding:4px 8px;background:#222;border-radius:3px;border-left:2px solid #4fc3f7;">
      </div>
    </div>

    <!-- ROI list + file pickers below the three-pane grid -->
    <div id="mprRoiPanel" style="margin-top:12px;">
      <div style="font-size:10px;font-weight:700;color:#666;letter-spacing:0.8px;
                  text-transform:uppercase;margin-bottom:6px;">Drawn ROIs</div>
      <!-- File pickers — hidden until their button is clicked -->
      <select id="mprRoiFileSelect" onchange="loadSelectedMprRoi()"
              style="display:none;width:320px;background:#1a1a1a;color:#ccc;
                     border:1px solid #444;border-radius:3px;padding:3px;
                     font-size:11px;margin-bottom:6px;">
        <option value="">— select file to load —</option>
      </select>
      <select id="mprRoiExportSelect" onchange="exportSelectedMprRoi()"
              style="display:none;width:320px;background:#1a1a1a;color:#ccc;
                     border:1px solid #444;border-radius:3px;padding:3px;
                     font-size:11px;margin-bottom:6px;">
        <option value="">— select file to export —</option>
      </select>
      <select id="mprInterpStructSelect"
              style="display:none;width:320px;background:#1a1a1a;color:#ccc;
                     border:1px solid #444;border-radius:3px;padding:3px;
                     font-size:11px;margin-bottom:6px;">
        <option value="">— select structure —</option>
      </select>
      <div id="mprRoiList">
        <div style="color:#555;font-size:12px;">No ROIs drawn</div>
      </div>
    </div>

  </div>

  <script src="roi-store.js"></script>
  <script src="roi-save.js"></script>
  <script src="mpr.js"></script>
  <script src="mpr-roi.js"></script>
  <script src="mpr-tab-init.js"></script>

</body>
</html>
